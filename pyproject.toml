[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filingsgraph"
version = "0.1.0"
description = "Temporal financial due-diligence and risk intelligence engine using SEC filings, XBRL, hybrid RAG and provenance-aware GraphRAG."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "FilingsGraph"}]
dependencies = [
  "beautifulsoup4>=4.12",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "gradio>=5.0",
  "httpx>=0.27",
  "huggingface-hub>=0.29",
  "langgraph>=0.2",
  "networkx>=3.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.24",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "qdrant-client>=1.11",
  "rank-bm25>=0.2.2",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "sentence-transformers>=3.0",
  "torch>=2.5",
  "transformers>=4.51",
  "accelerate>=1.0",
  "uvicorn[standard]>=0.30",
  "rich>=13.8",
  "orjson>=3.10",
  "psutil>=6.0",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2"]
neo4j = ["neo4j>=5.25"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "jupyterlab>=4.2",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
filingsgraph = "filingsgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
