reasoning:
  provider: local
  model: Qwen/Qwen3-14B
  backend: transformers
  max_new_tokens: 1400
  temperature: 0.2
reasoning_fast:
  provider: local
  model: Qwen/Qwen3-8B
  backend: transformers
  max_new_tokens: 600
  temperature: 0.1
embeddings:
  model: BAAI/bge-m3
  batch_size: 16
  normalize: true
reranker:
  model: BAAI/bge-reranker-v2-m3
  batch_size: 8
